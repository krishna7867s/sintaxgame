<svg height="100%" viewBox="0 0 600 320" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter height="160%" id="neon-glow" width="160%" x="-30%" y="-30%">
<feGaussianBlur result="blur1" stdDeviation="4"></feGaussianBlur>
<feGaussianBlur result="blur2" stdDeviation="10"></feGaussianBlur>
<feMerge>
<feMergeNode in="blur2"></feMergeNode>
<feMergeNode in="blur1"></feMergeNode>
<feMergeNode in="SourceGraphic"></feMergeNode>
</feMerge>
</filter>
<filter height="140%" id="heart-glitch" width="140%" x="-20%" y="-20%">
<feGaussianBlur result="blur" stdDeviation="2"></feGaussianBlur>
<feMerge>
<feMergeNode in="blur"></feMergeNode>
<feMergeNode in="SourceGraphic"></feMergeNode>
</feMerge>
</filter>
<style>
      @keyframes neonPulse {
        0%, 100% { filter: drop-shadow(0 0 6px #ff2e93) drop-shadow(0 0 16px rgba(255, 46, 147, 0.6)); opacity: 0.95; }
        50% { filter: drop-shadow(0 0 14px #ff2e93) drop-shadow(0 0 28px rgba(255, 46, 147, 0.9)) drop-shadow(0 0 45px rgba(0, 240, 255, 0.4)); opacity: 1; }
      }
      @keyframes glitchShake {
        0%, 88%, 100% { transform: translate(0, 0); }
        89% { transform: translate(-3px, 1px); }
        91% { transform: translate(3px, -2px); }
        93% { transform: translate(-2px, -1px); }
        95% { transform: translate(2px, 2px); }
        97% { transform: translate(0, 0); }
      }
      @keyframes heartBeat {
        0%, 100% { transform: scale(1); }
        14% { transform: scale(1.18); }
        28% { transform: scale(1.02); }
        42% { transform: scale(1.28); filter: drop-shadow(0 0 15px #ff2e93); }
        65% { transform: scale(1); }
      }
      @keyframes bracketFloatLeft {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(-6px); }
      }
      @keyframes bracketFloatRight {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(6px); }
      }
      @keyframes circuitFlow {
        0% { stroke-dashoffset: 120; opacity: 0.3; }
        50% { opacity: 1; stroke: #00f0ff; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes sparkBlink {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3) rotate(45deg); }
      }
      .badge-outer { animation: neonPulse 2.4s ease-in-out infinite, glitchShake 3.5s infinite; }
      .heart-element { transform-origin: 155px 160px; animation: heartBeat 1.4s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
      .bracket-l { transform-origin: 110px 160px; animation: bracketFloatLeft 2s ease-in-out infinite; }
      .bracket-r { transform-origin: 200px 160px; animation: bracketFloatRight 2s ease-in-out infinite; }
      .circuit-line { stroke-dasharray: 12 8; animation: circuitFlow 1.8s linear infinite; }
      .sparkle { transform-origin: center; animation: sparkBlink 1.2s ease-in-out infinite; }
      .sparkle-delay { animation-delay: 0.6s; }
    </style>
</defs>
<rect fill="#0d061a" height="320" rx="24" stroke="#2a1645" stroke-width="2" width="600"></rect>
<g opacity="0.12" stroke="#ff2e93" stroke-width="1">
<line x1="0" x2="600" y1="40" y2="40"></line><line x1="0" x2="600" y1="80" y2="80"></line><line x1="0" x2="600" y1="120" y2="120"></line><line x1="0" x2="600" y1="160" y2="160"></line><line x1="0" x2="600" y1="200" y2="200"></line><line x1="0" x2="600" y1="240" y2="240"></line><line x1="0" x2="600" y1="280" y2="280"></line><line x1="50" x2="50" y1="0" y2="320"></line><line x1="100" x2="100" y1="0" y2="320"></line><line x1="150" x2="150" y1="0" y2="320"></line><line x1="200" x2="200" y1="0" y2="320"></line><line x1="250" x2="250" y1="0" y2="320"></line><line x1="300" x2="300" y1="0" y2="320"></line><line x1="350" x2="350" y1="0" y2="320"></line><line x1="400" x2="400" y1="0" y2="320"></line><line x1="450" x2="450" y1="0" y2="320"></line><line x1="500" x2="500" y1="0" y2="320"></line><line x1="550" x2="550" y1="0" y2="320"></line>
</g>
<g class="badge-outer">
